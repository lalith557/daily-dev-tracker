```yaml
name: Daily Dev Tracker

on:
  schedule:
    # Runs every day at 18:30 UTC
    - cron: "30 18 * * *"

  # Allows you to run it manually from GitHub
  workflow_dispatch:

permissions:
  contents: write

jobs:
  run-tracker:
    runs-on: ubuntu-latest

    steps:
      - name: Checkout repository
        uses: actions/checkout@v4

      - name: Set up Python
        uses: actions/setup-python@v5
        with:
          python-version: "3.12"

      - name: Run Daily Dev Tracker
        run: python app.py

      - name: Commit generated activity
        run: |
          git config user.name "github-actions[bot]"
          git config user.email "41898282+github-actions[bot]@users.noreply.github.com"

          git add activity.json

          if git diff --cached --quiet; then
            echo "No changes to commit."
          else
            git commit -m "Update daily activity"
            git push
          fi
```
